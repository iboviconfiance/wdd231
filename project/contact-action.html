<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message envoyé | Diabo Esport Club</title>
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-dark: #0a0e17;
            --primary-blue: #1a237e;
            --electric-blue: #2979ff;
            --light-blue: #4fc3f7;
            --accent-white: #ffffff;
            --accent-black: #000000;
            --gray-dark: #1e1e1e;
            --gray-medium: #2d2d2d;
            --gray-light: #444444;
            --success: #4caf50;
            
            --font-heading: 'Rajdhani', sans-serif;
            --font-body: 'Inter', sans-serif;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: var(--font-body);
            line-height: 1.6;
            color: var(--accent-white);
            background-color: var(--primary-dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        
        .form-action-page {
            width: 100%;
            max-width: 800px;
        }
        
        .container {
            background-color: var(--gray-dark);
            padding: 3rem;
            border-radius: 8px;
            border: 2px solid var(--electric-blue);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        h1 {
            font-family: var(--font-heading);
            color: var(--electric-blue);
            margin-bottom: 2rem;
            text-align: center;
            font-size: 2.5rem;
        }
        
        .success-message {
            text-align: center;
            margin-bottom: 2rem;
            padding: 1rem;
            background-color: rgba(76, 175, 80, 0.1);
            border: 1px solid var(--success);
            border-radius: 4px;
            color: var(--success);
        }
        
        .form-data-card {
            background-color: var(--gray-medium);
            padding: 2rem;
            border-radius: 8px;
            margin-bottom: 2rem;
        }
        
        .data-item {
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--gray-light);
        }
        
        .data-item:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }
        
        .data-label {
            font-weight: 600;
            color: var(--light-blue);
            display: block;
            margin-bottom: 0.25rem;
            font-family: var(--font-heading);
        }
        
        .data-value {
            color: var(--accent-white);
        }
        
        .btn {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            background: linear-gradient(135deg, var(--electric-blue), var(--light-blue));
            color: var(--accent-white);
            text-decoration: none;
            border-radius: 4px;
            font-family: var(--font-heading);
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            margin-top: 1rem;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(41, 121, 255, 0.3);
        }
        
        .btn-container {
            text-align: center;
            margin-top: 2rem;
        }
        
        .timestamp {
            text-align: center;
            color: var(--light-blue);
            font-size: 0.9rem;
            margin-top: 1rem;
            opacity: 0.8;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 2rem 1.5rem;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .form-data-card {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="form-action-page">
        <div class="container">
            <h1>✅ Message envoyé avec succès!</h1>
            
            <div class="success-message">
                <p>Votre message a bien été reçu par Diabo Esport Club. Nous vous répondrons dans les plus brefs délais.</p>
            </div>
            
            <div id="formDataDisplay">
                <!-- Les données du formulaire seront affichées ici -->
                <div class="loading">Chargement des données...</div>
            </div>
            
            <div class="timestamp" id="timestamp"></div>
            
            <div class="btn-container">
                <a href="index.html" class="btn">Retour à l'accueil</a>
                <a href="index.html#contact" class="btn" style="margin-left: 1rem; background: transparent; border: 2px solid var(--electric-blue);">Nouveau message</a>
            </div>
        </div>
    </div>

    <script>
        // Récupérer les paramètres URL
        const urlParams = new URLSearchParams(window.location.search);
        const formData = {};
        
        // Collecter les données
        urlParams.forEach((value, key) => {
            formData[key] = decodeURIComponent(value);
        });
        
        // Afficher les données
        const displayDiv = document.getElementById('formDataDisplay');
        const timestampDiv = document.getElementById('timestamp');
        
        if (Object.keys(formData).length > 0) {
            let html = '<div class="form-data-card">';
            html += '<h2 style="margin-bottom: 1.5rem; color: var(--light-blue);">Récapitulatif de votre message</h2>';
            
            // Mapper les clés à des labels français
            const labels = {
                'name': 'Nom complet',
                'email': 'Adresse email',
                'subject': 'Sujet',
                'message': 'Message'
            };
            
            // Mapper les valeurs de sujet
            const subjectMap = {
                'recrutement': 'Recrutement',
                'partenariat': 'Partenariat',
                'general': 'Question générale',
                'tournoi': 'Information tournoi'
            };
            
            Object.entries(formData).forEach(([key, value]) => {
                let displayValue = value;
                
                // Formater le sujet
                if (key === 'subject') {
                    displayValue = subjectMap[value] || value;
                }
                
                // Formater le message (préserver les sauts de ligne)
                if (key === 'message') {
                    displayValue = value.replace(/\n/g, '<br>');
                }
                
                html += `
                    <div class="data-item">
                        <span class="data-label">${labels[key] || key}:</span>
                        <span class="data-value">${displayValue}</span>
                    </div>
                `;
            });
            
            html += '</div>';
            displayDiv.innerHTML = html;
            
            // Afficher la date et l'heure
            const now = new Date();
            const options = { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            };
            timestampDiv.textContent = `Envoyé le ${now.toLocaleDateString('fr-FR', options)}`;
            
            // Sauvegarder dans localStorage
            try {
                const submissions = JSON.parse(localStorage.getItem('diabo_form_submissions') || '[]');
                submissions.push({
                    ...formData,
                    timestamp: now.toISOString()
                });
                localStorage.setItem('diabo_form_submissions', JSON.stringify(submissions));
            } catch (e) {
                console.log('Impossible de sauvegarder dans localStorage');
            }
            
        } else {
            displayDiv.innerHTML = `
                <div class="form-data-card">
                    <p>Aucune donnée de formulaire reçue.</p>
                    <p>Veuillez utiliser le <a href="index.html#contact" style="color: var(--light-blue);">formulaire de contact</a> pour nous envoyer un message.</p>
                </div>
            `;
        }
    </script>
</body>
</html>
